<!-- Форма записи: только на странице «Запись» -->
        <form class="ticket" action="#" method="post" novalidate data-js="callback-form"
              data-booking-days="{{site.booking.daysAhead}}"
              data-booking-schedule="{{site.bookingSchedule}}">
          <div class="ticket__head">
            <span class="mono">Заказ-наряд</span>
            <span class="mono" data-js="ticket-number">№ —</span>
          </div>

          <div class="field">
            <label class="field__label" for="f-name">Как к вам обращаться</label>
            <input class="field__input" id="f-name" name="name" type="text" autocomplete="name"
                   maxlength="60" required aria-describedby="f-name-error">
            <p class="field__error" id="f-name-error" data-js="error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="f-phone">Телефон</label>
            <input class="field__input" id="f-phone" name="phone" type="tel" autocomplete="tel"
                   inputmode="tel" placeholder="+7 (___) ___-__-__" maxlength="18" required
                   aria-describedby="f-phone-error" data-js="phone">
            <p class="field__error" id="f-phone-error" data-js="error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="f-service">Услуга <span class="field__optional">— необязательно</span></label>
            <select class="field__input field__input--select" id="f-service" name="service">
              <option value="">Не знаю, нужна консультация</option>
              {{#each formServices}}<option value="{{it.title}}" data-slug="{{it.slug}}">{{it.title}}</option>
              {{/each}}
            </select>
          </div>

          <fieldset class="field field--group">
            <legend class="field__label">Когда удобно приехать <span class="field__optional">— необязательно</span></legend>
            <div class="field__row">
              <label class="visually-hidden" for="f-date">День</label>
              <select class="field__input field__input--select" id="f-date" name="visitDate" data-js="visit-date">
                <option value="">Любой день</option>
              </select>
              <label class="visually-hidden" for="f-time">Время</label>
              <select class="field__input field__input--select" id="f-time" name="visitTime" data-js="visit-time" disabled>
                <option value="">Любое время</option>
              </select>
            </div>
            <p class="field__hint">{{home.form.hint}}</p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="f-car">Марка и модель <span class="field__optional">— необязательно</span></label>
            <input class="field__input" id="f-car" name="car" type="text" maxlength="60"
                   placeholder="Например, Kia Rio 2018">
          </div>

          <div class="field">
            <label class="field__label" for="f-problem">Что случилось <span class="field__optional">— необязательно</span></label>
            <textarea class="field__input field__input--area" id="f-problem" name="problem" rows="3" maxlength="500"
                      placeholder="Например, стучит спереди справа на кочках"></textarea>
          </div>

          <!-- Ловушка для ботов: людям не видна -->
          <div class="hp" aria-hidden="true">
            <label for="f-website">Сайт</label>
            <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <p class="field__hint">{{home.form.privacy}}</p>

          <div class="field field--check">
            <input class="check" id="f-consent" name="consent" type="checkbox" required aria-describedby="f-consent-error">
            <label class="check__label" for="f-consent">
              Согласен на обработку персональных данных
              в соответствии с <a href="{{root}}privacy.html">политикой конфиденциальности</a>
            </label>
            <p class="field__error" id="f-consent-error" data-js="error"></p>
          </div>

          <button class="btn btn--wide" type="submit" data-js="submit">Записаться</button>

          <p class="ticket__status" role="status" aria-live="polite" data-js="status"></p>

          <span class="stamp" aria-hidden="true">Принято</span>
        </form>
